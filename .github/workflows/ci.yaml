name: CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main, alpha, beta, rc, next]

jobs:
  pr_checks:
    name: PR Checks
    if: >-
      ${{
        github.event_name == 'pull_request'
        && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'github-actions[bot]' && startsWith(github.event.pull_request.title, '[release '))
      }}
    # Internal action, no need to pin
    # nosemgrep: github-actions-mutable-action-tag
    uses: elastiflow/gha-reusable/.github/workflows/reusable_pr_checks.yml@v0

  mandatory_checks:
    name: Security checks
    # Internal action, no need to pin
    # nosemgrep: github-actions-mutable-action-tag
    uses: elastiflow/gha-reusable/.github/workflows/reusable_mandatory_checks.yml@v0

  renovate_checks:
    name: Security checks
    # Internal action, no need to pin
    # nosemgrep: github-actions-mutable-action-tag
    uses: elastiflow/gha-reusable/.github/workflows/reusable_renovate_checks.yml@v0

  fmt:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt -- --check

  check_and_build:
    name: Check, Lint & Build
    runs-on: ubuntu-latest-4c
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: nightly-2026-04-11
          components: clippy, rust-src
      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Add LLVM repo
        run: |
          sudo wget --progress=dot:giga -O /etc/apt/trusted.gpg.d/apt.llvm.org.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          gpg --show-keys --with-fingerprint /etc/apt/trusted.gpg.d/apt.llvm.org.asc | grep '6084 F3CF 814B 57C1 CF12  EFD5 15CF 4D18 AF4F 7421'

          sudo cat <<EOF | sudo tee /etc/apt/sources.list.d/llvm-22.list
          deb [signed-by=/etc/apt/trusted.gpg.d/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main
          deb-src [signed-by=/etc/apt/trusted.gpg.d/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main
          EOF

      - name: Install eBPF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-22-dev libclang-22-dev libelf-dev libz-dev make

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0

      - name: Install bpf-linker
        run: command -v bpf-linker &> /dev/null || cargo binstall --disable-telemetry -y bpf-linker --force

      - name: Build eBPF and userspace code
        run: cargo build -r

      - name: Lint eBPF code
        run: cargo clippy -p mermin-ebpf -- -D warnings

      - name: Lint userspace code
        run: cargo clippy -- -D warnings

  test:
    name: Run Tests
    runs-on: ubuntu-latest-4c
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: nightly-2026-04-11
          components: rust-src
      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Add LLVM repo
        run: |
          sudo wget --progress=dot:giga -O /etc/apt/trusted.gpg.d/apt.llvm.org.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          gpg --show-keys --with-fingerprint /etc/apt/trusted.gpg.d/apt.llvm.org.asc | grep '6084 F3CF 814B 57C1 CF12  EFD5 15CF 4D18 AF4F 7421'

          sudo cat <<EOF | sudo tee /etc/apt/sources.list.d/llvm-22.list
          deb [signed-by=/etc/apt/trusted.gpg.d/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main
          deb-src [signed-by=/etc/apt/trusted.gpg.d/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main
          EOF

      - name: Install eBPF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-22-dev libclang-22-dev libelf-dev libz-dev make

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0

      - name: Install bpf-linker
        run: command -v bpf-linker &> /dev/null || cargo binstall --disable-telemetry -y bpf-linker --force

      - name: Install cargo-nextest
        run: |
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Run default tests
        run: cargo nextest run -r --workspace --exclude mermin-ebpf --no-fail-fast

      - name: Run doc tests
        run: cargo test --doc

      - name: Run eBPF tests
        run: cargo test -r -p mermin-ebpf --features test

  helm_checks:
    name: Run Helm sanity checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          check-latest: true
      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
      - name: Install Helm dependencies
        run: |
          find charts -mindepth 1 -maxdepth 1 -type d | while read -r chart; do
            echo Building for ${chart}
            (helm dependency list ${chart} || true) | grep -E 'https://' | while read -r dep; do
              helm repo add $(echo ${dep} | awk '{print $1}') $(echo ${dep} | awk '{print $4}')
            done

            helm dependency build ${chart}
          done
      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        # TODO(mack#ENG-53|2025-08-06): Remove --check-version-increment when ready to publish
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --validate-maintainers=false --check-version-increment=false
      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      # TODO: Enable this when the docker image is available on Docker Hub.
      # - name: Run chart-testing (install)
      #   if: steps.list-changed.outputs.changed == 'true'
      #   run: ct install --target-branch ${{ github.event.repository.default_branch }}

  docker_build:
    name: Docker Build
    # Internal action, no need to pin
    # nosemgrep: github-actions-mutable-action-tag
    uses: elastiflow/gha-reusable/.github/workflows/reusable_docker_build_multiarch.yaml@v0
    permissions:
      contents: read
      id-token: write
    with:
      matrix_runner: '["ubuntu-latest", "ubuntu-latest-arm"]'
      matrix_target: '["runner", "runner-debug"]'
      runner_platform_map: |
        {
          "ubuntu-latest": "linux/amd64",
          "ubuntu-latest-arm": "linux/arm64"
        }
      version: "local"
      cache_storage: aws_s3
      cache_region: "us-east-2"
      cache_from: |
        type=s3,region=us-east-2,bucket=docker-build-cache-296062568418-us-east-2-an,prefix=mermin/mermin-,name=mermin-{0}-{1}
        type=s3,region=us-east-2,bucket=docker-build-cache-296062568418-us-east-2-an,prefix=mermin/mermin-,name=mermin-main-{1}
      cache_to:
        type=s3,mode=max,region=us-east-2,bucket=docker-build-cache-296062568418-us-east-2-an,prefix=mermin/mermin-,name=mermin-{0}-{1}
      aws_iam_role: arn:aws:iam::296062568418:role/gha-docker-cache

  cni_tests:
    name: CNI Tests
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-e2e-tests.yaml
    with:
      test-path: "./mermin/tests/e2e/cni/test.sh"
      image-tag: "cni-e2e-test"

  schema_version_check:
    name: Check eBPF Map Schema Version
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check if FlowKey or FlowStats changed without version increment
        run: |
          # Get the base branch to compare against
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          HEAD_REF="${{ github.sha }}"

          echo "Comparing ${BASE_REF} -> ${HEAD_REF}"

          # Check if FlowKey or FlowStats structs changed
          STRUCT_CHANGES=$(git diff ${BASE_REF}..${HEAD_REF} -- mermin-common/src/lib.rs | grep -E '^\+.*pub struct (FlowKey|FlowStats)' || true)
          FIELD_CHANGES=$(git diff ${BASE_REF}..${HEAD_REF} -- mermin-common/src/lib.rs | grep -E '^\+[[:space:]]+(pub [[:alnum:]_]+:|///)' | grep -v '^\+[[:space:]]*///' || true)

          if [ -n "$STRUCT_CHANGES" ] || [ -n "$FIELD_CHANGES" ]; then
            echo "✗ Detected changes to FlowKey or FlowStats structs in mermin-common/src/lib.rs"

            # Check if EBPF_MAP_SCHEMA_VERSION was incremented
            OLD_VERSION=$(git show ${BASE_REF}:mermin/src/main.rs | grep 'const EBPF_MAP_SCHEMA_VERSION:' | grep -oE '[0-9]+')
            NEW_VERSION=$(git show ${HEAD_REF}:mermin/src/main.rs | grep 'const EBPF_MAP_SCHEMA_VERSION:' | grep -oE '[0-9]+')

            echo "Old schema version: ${OLD_VERSION}"
            echo "New schema version: ${NEW_VERSION}"

            if [ "$NEW_VERSION" -le "$OLD_VERSION" ]; then
              echo ""
              echo "❌ ERROR: FlowKey or FlowStats structs changed but EBPF_MAP_SCHEMA_VERSION was not incremented!"
              echo ""
              echo "REQUIRED ACTION:"
              echo "  Increment EBPF_MAP_SCHEMA_VERSION in mermin/src/main.rs from ${OLD_VERSION} to $((OLD_VERSION + 1))"
              echo ""
              echo "WHY: Changing FlowKey/FlowStats layout breaks eBPF map compatibility."
              echo "     Incrementing the version ensures old pinned maps are not reused."
              echo ""
              exit 1
            else
              echo "✓ Schema version was correctly incremented from ${OLD_VERSION} to ${NEW_VERSION}"
            fi
          else
            echo "✓ No changes detected to FlowKey or FlowStats structs"
          fi

  all_checks:
    name: All Checks
    if: always()
    runs-on: ubuntu-latest
    needs:
      - pr_checks
      - fmt
      - check_and_build
      - test
      - helm_checks
      - docker_build
      - cni_tests
      - schema_version_check
    steps:
      - name: Check if all checks passed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJson(needs) }}
          allowed-skips: '["pr_checks", "schema_version_check"]'
