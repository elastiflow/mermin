name: E2E CNI Tests

on:
  workflow_call:
    inputs:
      cni-list:
        description: "JSON list of CNIs to test"
        required: false
        default: '["calico", "cilium", "flannel", "kindnetd"]'
        type: string
      test-path:
        description: "path the the e2e test suite that should be run"
        required: true
        type: string
      image-tag:
        description: "Tag of the Mermin image to use for testing"
        required: false
        default: "latest"
        type: string

jobs:
  build:
    name: Build Mermin Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Set standard vars
        id: standard_vars
        env:
          REF_NAME: ${{ github.ref_name }}
          PLATFORM: "linux/amd64"
        run: |
          echo "ref_name=$(echo ${REF_NAME} | tr '/' '_')" >> $GITHUB_OUTPUT
          echo "arch=$(echo ${PLATFORM} | tr '/' '_')" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::296062568418:role/gha-docker-cache
          role-duration-seconds: 3600

      - name: Build docker image
        # Internal action, no need to pin
        # nosemgrep: github-actions-mutable-action-tag
        uses: elastiflow/gha-reusable/actions/docker-build-push@v0
        with:
          image: mermin
          tag: ${{ inputs.image-tag }}
          platforms: linux/amd64
          target: runner-debug
          load: true
          provenance: ""
          sbom: "false"
          cache_from: |
            type=s3,region=us-east-2,bucket=docker-build-cache-296062568418-us-east-2-an,prefix=mermin/mermin-,name=mermin-${{ steps.standard_vars.outputs.ref_name }}-${{ steps.standard_vars.outputs.arch}}-runner-debug
            type=s3,region=us-east-2,bucket=docker-build-cache-296062568418-us-east-2-an,prefix=mermin/mermin-,name=mermin-main-${{ steps.standard_vars.outputs.arch}}-runner-debug
          cache_to:
            type=s3,mode=max,region=us-east-2,bucket=docker-build-cache-296062568418-us-east-2-an,prefix=mermin/mermin-,name=mermin-${{ steps.standard_vars.outputs.ref_name }}-${{ steps.standard_vars.outputs.arch}}-runner-debug

      - name: Save Docker image as an artifact
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          mkdir -p image-artifact
          docker save not-exists.elastiflow.com/mermin:${IMAGE_TAG} -o image-artifact/mermin-${IMAGE_TAG}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mermin-docker-image-${{ inputs.image-tag }}
          path: image-artifact/

  cni-integration-test:
    name: ${{ matrix.cni }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cni: ${{ fromJson(inputs.cni-list) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go for Cilium CLI install
        if: matrix.cni == 'cilium'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"

      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mermin-docker-image-${{ inputs.image-tag }}
          path: image-artifact/

      - name: Load Docker image
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: docker load < image-artifact/mermin-${IMAGE_TAG}.tar

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.3.3/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Make test script executable
        env:
          TEST_PATH: ${{ inputs.test-path }}
        run: chmod +x ${TEST_PATH}

      - name: Run E2E Test for ${{ matrix.cni }}
        env:
          CNI: ${{ matrix.cni }}
          DOCKER_REPOSITORY: not-exists.elastiflow.com/mermin
          DOCKER_IMAGE_TAG: ${{ inputs.image-tag }}
          HOST_DOCKER_INTERNAL_ADDR: 172.17.0.1
          MERMIN_CONFIG_PATH: docs/deployment/examples/local/config.example.hcl
          TEST_PATH: ${{ inputs.test-path }}
        run: ${TEST_PATH}
