name: E2E CNI Tests

on:
  workflow_call:
    inputs:
      cni-list:
        description: "JSON list of CNIs to test"
        required: false
        default: '["calico", "cilium", "flannel", "kindnetd"]'
        type: string
      test-path:
        description: "path the the e2e test suite that should be run"
        required: true
        type: string
      image-tag:
        description: "Tag of the Mermin image to use for testing"
        required: false
        default: "latest"
        type: string

jobs:
  build:
    name: Build Mermin Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: gcr_auth
        with:
          token_format: "access_token"
          project_id: "pub-artifacts-j8rjbu"
          workload_identity_provider: "projects/701687754822/locations/global/workloadIdentityPools/github-actions/providers/github-actions"
          service_account: "gha-registry-writer@pub-artifacts-j8rjbu.iam.gserviceaccount.com"

      - name: Login to GCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcr_auth.outputs.access_token }}

      - name: Hack dependency caching
        run: |
          cp mermin/Cargo.toml mermin/Cargo.toml.orig
          cp Cargo.lock Cargo.lock.orig
          sed -i 's/^version = ".*"/version = "0.0.1"/' mermin/Cargo.toml | head -n 5 mermin/Cargo.toml
          cat Cargo.lock.orig | tr '\n' '\r' \
            | sed 's/name = "mermin"\rversion = "[0-9]\{,999\}\.[0-9]\{,999\}\.[0-9]\{,999\}"\r/name = "mermin"\rversion = "0.0.1"\r/' \
            | tr '\r' '\n'  > Cargo.lock

      - name: Build docker image
        uses: elastiflow/gha-reusable/actions/docker-build-push@v0
        with:
          image: mermin
          tag: ${{ inputs.image-tag }}
          platforms: linux/amd64
          target: runner-debug
          load: true
          provenance: ""
          sbom: "false"
          cache_from: type=registry,ref=us-docker.pkg.dev/pub-artifacts-j8rjbu/docker-cache/mermin-ci-runner-debug-linux/amd64
          cache_to: type=registry,ref=us-docker.pkg.dev/pub-artifacts-j8rjbu/docker-cache/mermin-ci-runner-debug-linux/amd64,mode=max

      - name: Save Docker image as an artifact
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          mkdir -p image-artifact
          docker save not-exists.elastiflow.com/mermin:${IMAGE_TAG} -o image-artifact/mermin-${IMAGE_TAG}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mermin-docker-image-${{ inputs.image-tag }}
          path: image-artifact/

  cni-integration-test:
    name: ${{ matrix.cni }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cni: ${{ fromJson(inputs.cni-list) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go for Cilium CLI install
        if: matrix.cni == 'cilium'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.24"

      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mermin-docker-image-${{ inputs.image-tag }}
          path: image-artifact/

      - name: Load Docker image
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: docker load < image-artifact/mermin-${IMAGE_TAG}.tar

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.3.3/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Make test script executable
        env:
          TEST_PATH: ${{ inputs.test-path }}
        run: chmod +x ${TEST_PATH}

      - name: Run E2E Test for ${{ matrix.cni }}
        env:
          CNI: ${{ matrix.cni }}
          DOCKER_REPOSITORY: not-exists.elastiflow.com/mermin
          DOCKER_IMAGE_TAG: ${{ inputs.image-tag }}
          HOST_DOCKER_INTERNAL_ADDR: 172.17.0.1
          MERMIN_CONFIG_PATH: docs/deployment/examples/local/config.example.hcl
          TEST_PATH: ${{ inputs.test-path }}
        run: ${TEST_PATH}
