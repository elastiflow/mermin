---
name: Release Mermin
concurrency:
  group: release-mermin-${{ github.ref }}
  cancel-in-progress: false
on:
  push:
    branches:
      - main
      - alpha
      - beta
    paths-ignore:
      - 'docs/**/*'
      - 'charts/mermin-netobserv-os-stack/**/*'
      - 'traffic-gen/**/*'
      - '.github/workflows/release_mermin-netobserv-os-stack.yaml'


env:
  BRANCH_TAG_PREFIXES: |
    {
        "alpha": "v0.2.0-alpha.",
        "beta": "v0.2.0-beta.",
        "main": "v"
    }

jobs:
  # Detect if a commit was made from a release PR with title like '[release v0.1.1] (#49)'
  release_or_pr:
    name: Release or Release PR?
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.release_or_pr.outputs.is_release }}
    steps:
      - id: release_or_pr
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          cat > /tmp/commit_message <<- EOF
          ${COMMIT_MESSAGE}
          EOF
          cat /tmp/commit_message
          # https://regex101.com/r/1z85UX/3
          echo $(grep -Pq '^\[release .+\] \(#[0-9]{1,5}\)$' /tmp/commit_message && echo true || echo false) > /tmp/is_release
          echo "is_release=$(cat /tmp/is_release)" >> $GITHUB_OUTPUT

  release_pr_create:
    name: Release PR create
    needs: [release_or_pr]
    if: ${{ ! fromJson(needs.release_or_pr.outputs.is_release) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Prepare Release
        id: prepare_release
        uses: elastiflow/gha-reusable/actions/prepare-release@v0
        with:
          tag_prefix: ${{ fromJson(env.BRANCH_TAG_PREFIXES)[github.ref_name] }}
          exclude_paths: "docs/**/*,charts/mermin-netobserv-os-stack/**/*,charts/traffic-gen/**/*"
          changelog_update: true
          bump_version_yaml: true
          bump_version_yaml_path: charts/mermin/Chart.yaml
          bump_version_yaml_key: '.version,.appVersion'
      - name: Bump Cargo.toml/Cargo.lock version
        if: ${{ fromJson(steps.prepare_release.outputs.new_release_published) }}
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ steps.prepare_release.outputs.new_release_version }}\"/" mermin/Cargo.toml
          cargo update -v mermin
      - name: Create Pull Request
        if: ${{ fromJson(steps.prepare_release.outputs.new_release_published) }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: "${{ github.ref_name }}"
          branch: release-from-${{ github.ref_name }}
          title: '[release ${{ steps.prepare_release.outputs.new_release_git_tag }}]'
          body: |
            # Description
            Release the ${{ steps.prepare_release.outputs.new_release_git_tag }} version

            # Changelog
            ${{ steps.prepare_release.outputs.new_release_notes }}

  release:
    name: Release
    needs: [release_or_pr]
    if: ${{ fromJson(needs.release_or_pr.outputs.is_release) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_release_published: ${{ steps.prepare_release.outputs.new_release_published }}
      new_release_version: ${{ steps.prepare_release.outputs.new_release_version }}
      new_release_git_tag: ${{ steps.prepare_release.outputs.new_release_git_tag }}
      new_release_notes: ${{ steps.prepare_release.outputs.new_release_notes }}
    env:
      CHARTS_DIR: charts/mermin
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Prepare Release
        id: prepare_release
        uses: elastiflow/gha-reusable/actions/prepare-release@v0
        with:
          tag_prefix: ${{ fromJson(env.BRANCH_TAG_PREFIXES)[github.ref_name] }}
          exclude_paths: "docs/**/*,charts/mermin-netobserv-os-stack/**/*,charts/traffic-gen/**/*"
      - name: Create GH release
        if: ${{ fromJson(steps.prepare_release.outputs.new_release_published) }}
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: ${{ steps.prepare_release.outputs.new_release_git_tag }}
          tag_name: ${{ steps.prepare_release.outputs.new_release_git_tag }}
          body: |
            ${{ steps.prepare_release.outputs.new_release_notes }}

            Docker images:
            - `ghcr.io/elastiflow/mermin:${{ steps.prepare_release.outputs.new_release_git_tag }}`
            - `ghcr.io/elastiflow/mermin:${{ steps.prepare_release.outputs.new_release_git_tag }}-debug`
            - `docker.io/elastiflow/mermin:${{ steps.prepare_release.outputs.new_release_git_tag }}`
            - `docker.io/elastiflow/mermin:${{ steps.prepare_release.outputs.new_release_git_tag }}-debug`
          target_commitish: ${{ github.ref_name }}
          preserve_order: true
          make_latest: true

  docker_build_push:
    name: Docker Build/Push
    needs: [release]
    if: ${{ fromJson(needs.release.outputs.new_release_published) }}
    uses: elastiflow/gha-reusable/.github/workflows/reusable_docker_build_multiarch.yaml@v0
    permissions:
      contents: read
      packages: write
      artifact-metadata: write
      attestations: write
      id-token: write
    with:
      matrix_runner: '[ubuntu-latest, ubuntu-latest-arm]'
      matrix_target: '["runner", "runner-debug"]'
      matrix_include_tag_suffix: '[{"target": "runner", "tag_suffix": ""}, {"target": "runner-debug", "tag_suffix": "-debug"}]'
      runner_platform_map: |
        {
          "ubuntu-latest": "linux/amd64",
          "ubuntu-latest-arm": "linux/arm64"
        }
      version: "${{ needs.release.outputs.new_release_git_tag }}"
      cache_storage: aws_s3
      cache_region: "us-east-2"
      cache_from: |
        type=s3,region=us-east-2,bucket=docker-build-cache-296062568418-us-east-2-an,prefix=mermin/mermin-,name=mermin-{0}-{1}
        type=s3,region=us-east-2,bucket=docker-build-cache-296062568418-us-east-2-an,prefix=mermin/mermin-,name=mermin-main-{1}
      cache_to:
        type=s3,mode=max,region=us-east-2,bucket=docker-build-cache-296062568418-us-east-2-an,prefix=mermin/mermin-,name=mermin-{0}-{1}
      aws_iam_role: arn:aws:iam::296062568418:role/gha-docker-cache
      ghcr_push: true
      ghcr_image: ${{ github.repository }}
      dockerhub_push: true
      dockerhub_image: "elastiflow/mermin"
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_api_token: ${{ secrets.DOCKERHUB_API_TOKEN }}

  release_chart:
    name: Release Chart
    needs: [release, docker_build_push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CHARTS_DIR: charts/mermin
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
      - name: Install Helm dependencies
        run: |
          (helm dependency list ${{ env.CHARTS_DIR }} || true) | grep -E 'https://' | while read -r dep; do
            helm repo add $(echo ${dep} | awk '{print $1}') $(echo ${dep} | awk '{print $4}')
          done
      - name: Install chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          install_only: true
      - name: Package helm chart
        run: |
          cr package ${{ env.CHARTS_DIR }}
      - name: Create GH release
        if: ${{ fromJson(needs.release.outputs.new_release_published) }}
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: mermin-${{ needs.release.outputs.new_release_version }}
          tag_name: mermin-${{ needs.release.outputs.new_release_version }}
          body: |
            Helm chart for Mermin ${{ needs.release.outputs.new_release_version }}
            ${{ needs.release.outputs.new_release_notes }}
          target_commitish: ${{ github.ref_name }}
          preserve_order: true
          make_latest: true
          files: ".cr-release-packages/*.tgz"
      - name: Update GH pages index
        run: |
          mkdir .cr-index
          cr index --push -t ${{ secrets.GITHUB_TOKEN }} --owner elastiflow --git-repo mermin
